name: '规划'
description: '规划编译流程（改进版：更高效地生成 matrix，避免为每个配置重复 clone openwrt）'
outputs:
  matrix:
    description: "matrix参数"
    value: ${{ steps.config-generator.outputs.matrix }}
runs:
  using: "composite"
  steps:
    - run: |
        set -euo pipefail
        config=$(grep "^config=" $GITHUB_WORKSPACE/config/OpenWrt.config|sed "s/.*=//g")
        if [ -z "$config" ] ; then
          echo "::error ::选择的配置为空"
          exit 1
        elif [ "$(echo "$config"|grep -c "[!@#$%^&:*=+\`~\'\"\(\)/ ]")" -ne '0' ] ; then
          echo "::error ::选择的配置中有非法字符"
          exit 1
        else
          for i in $(echo $config|sed "s/,/ /g"); do
            if ! [ -d "$GITHUB_WORKSPACE/config/$i" ]; then
              echo "::error ::配置$i不存在"
              exit 1
            fi
          done
        fi
        echo config=$config >> "$GITHUB_ENV"
      shell: bash

    - run: |
        # Helper: try parse CONFIG_* values directly from target.config
        parse_target_config() {
          cfgfile="$1"
          tgt=""
          sub=""
          archpkgs=""
          if [ -f "$cfgfile" ]; then
            tgt=$(sed -n '/^CONFIG_TARGET_BOARD/p' "$cfgfile" | sed -e 's/CONFIG_TARGET_BOARD\="//' -e 's/"//') || true
            sub=$(sed -n '/^CONFIG_TARGET_SUBTARGET/p' "$cfgfile" | sed -e 's/CONFIG_TARGET_SUBTARGET\="//' -e 's/"//') || true
            archpkgs=$(sed -n '/^CONFIG_TARGET_ARCH_PACKAGES/p' "$cfgfile" | sed -e 's/CONFIG_TARGET_ARCH_PACKAGES\="//' -e 's/"//') || true
          fi
          echo "$tgt|$sub|$archpkgs"
        }

        TMPFILE=$(mktemp)
        export parameter=matrix={\'include\':[ 
        NEED_FULL_RESOLVE=0

        # First pass: validate files that must exist and attempt to parse target config directly
        for i in $(echo $config|sed "s/,/ /g"); do
          # 必要性检查（和原逻辑保持一致）
          if [ ! -e "$GITHUB_WORKSPACE/config/$i/OpenWrt-K/compile.config" ]; then
            echo "::error ::$i配置中缺少openwrt编译配置文件(OpenWrt-K/compile.config),请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          elif [ -z "$(sed -n '/openwrt_tag\/branch/p' $GITHUB_WORKSPACE/config/$i/OpenWrt-K/compile.config | sed -e 's/.*=//')" ]; then
            echo "::error ::无法获取$i配置中编译的openwrt分支或版本,请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          fi
          if [ ! -e "$GITHUB_WORKSPACE/config/$i/OpenWrt-K/openwrtext.config" ]; then
            echo "::error ::$i配置中缺少openwrt拓展配置文件(OpenWrt-K/openwrtext.config),请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          elif [ "$(grep -c "^ipaddr=" $GITHUB_WORKSPACE/config/$i/OpenWrt-K/openwrtext.config)" -eq 0 ];then
            echo "::error ::无法获取$i配置中openwrt的默认IP(在OpenWrt-K/openwrtext.config中),请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          elif [ "$(grep -c "^timezone=" $GITHUB_WORKSPACE/config/$i/OpenWrt-K/openwrtext.config)" -eq 0 ];then
            echo "::error ::无法获取$i配置中openwrt的时区(在OpenWrt-K/openwrtext.config中),请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          elif [ "$(grep -c "^zonename=" $GITHUB_WORKSPACE/config/$i/OpenWrt-K/openwrtext.config)" -eq 0 ];then
            echo "::error ::无法获取$i配置中openwrt的时区区域名称(在OpenWrt-K/openwrtext.config中),请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          fi
          if [ -z "$(sed -n '/^kmod_compile_exclude_list=/p' $GITHUB_WORKSPACE/config/$i/OpenWrt-K/compile.config | sed -e "s/=[my]\([,]\{0,1\}\)/\1/g" -e 's/.*=//')" ];then
            echo "::warning ::无法获取$i配置中的kmod编译排除列表，这很有可能导致编译失败。"
          fi

          # 检查拓展软件包配置文件
          if [ ! -e "$GITHUB_WORKSPACE/config/$i/OpenWrt-K/extpackages.config" ]; then
            echo "::error ::$i配置中缺少拓展软件包配置文件(OpenWrt-K/extpackages.config)即使为空也应该存在,请尝试使用新版OpenWrt-k配置构建工具"
            exit 1
          else
            EXT_PKGS_CONFIG=$GITHUB_WORKSPACE/config/$i/OpenWrt-K/extpackages.config
            NUMBER_OF_PKGS1=$(grep -c "^EXT_PACKAGES_NAME\[" $EXT_PKGS_CONFIG)
            NUMBER_OF_PKGS2=$(sed -n -e "/^EXT_PACKAGES_NAME\[/p" $EXT_PKGS_CONFIG|sed -n '$p'|sed 's/EXT_PACKAGES_NAME\[\([0-9]*\).*/\1/')
            if [ -z "$NUMBER_OF_PKGS1" ]; then
              echo "::warning ::$i配置中的拓展软件包配置文件中没有任何拓展软件包配置。"
            elif [ "$NUMBER_OF_PKGS1" -ne "$NUMBER_OF_PKGS2" ]; then
              echo "::error ::$i配置中拓展软件包配置文件(OpenWrt-K/extpackages.config)有错误"
              n=1
              # 找出缺少的拓展软件包配置
              while [ "$n" -le $NUMBER_OF_PKGS2 ]; do
                if [ $(grep -c "^EXT_PACKAGES_NAME\[$n\]" $EXT_PKGS_CONFIG) -eq 0 ]; then
                  echo "::error ::$i配置中拓展软件包配置序号为$n的配置不存在"
                fi
                n=$(( n+1 ))
              done
            fi
          fi

          # 尝试直接从 target.config 提取信息，避免 clone + make
          TARGET_CFG="$GITHUB_WORKSPACE/config/$i/target.config"
          vals=$(parse_target_config "$TARGET_CFG")
          tgt=$(echo "$vals" | cut -d'|' -f1)
          sub=$(echo "$vals" | cut -d'|' -f2)
          archpkgs=$(echo "$vals" | cut -d'|' -f3)
          if [ -z "$tgt" ] || [ -z "$sub" ]; then
            # 需要完整解析（后续会使用 openwrt make defconfig）
            NEED_FULL_RESOLVE=1
          fi
          # 保存中间结果（即使为空）
          echo "$i|$tgt|$sub|$archpkgs" >> $TMPFILE
        done

        # 如果都能直接解析，则无需 clone openwrt
        OPENWRT_TMP_DIR=""
        if [ "$NEED_FULL_RESOLVE" -eq 1 ]; then
          echo "::notice ::部分配置缺少直接可解析的 target 信息，克隆 openwrt 进行一次性解析（比为每个配置单独 clone 更高效）"
          OPENWRT_TMP_DIR=$(mktemp -d)
          git clone --depth=1 https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_TMP_DIR"
        fi

        # 第二轮：处理 TMPFILE，以构建 matrix 参数
        while IFS="|" read -r cfg tgt sub archpkgs; do
          OPENWRT_TAG_BRANCH="$(sed -n '/openwrt_tag\/branch/p' $GITHUB_WORKSPACE/config/$cfg/OpenWrt-K/compile.config | sed -e 's/.*=//')"
          if { [ -z "$tgt" ] || [ -z "$sub" ]; } && [ -n "$OPENWRT_TMP_DIR" ]; then
            # 在临时 openwrt 目录解析
            cd "$OPENWRT_TMP_DIR"
            git fetch --depth=1 origin "$OPENWRT_TAG_BRANCH" || true
            git checkout -f "$OPENWRT_TAG_BRANCH" || true
            # 将 target.config (如果存在) 追加到 .config 并运行 make defconfig
            cat $GITHUB_WORKSPACE/config/$cfg/target.config >> .config || true
            make defconfig >/dev/null 2>&1 || true
            tgt=$(sed -n '/^CONFIG_TARGET_BOARD/p' .config | sed -e 's/CONFIG_TARGET_BOARD\="//' -e 's/"//') || true
            sub=$(sed -n '/^CONFIG_TARGET_SUBTARGET/p' .config | sed -e 's/CONFIG_TARGET_SUBTARGET\="//' -e 's/"//') || true
            archpkgs=$(sed -n '/^CONFIG_TARGET_ARCH_PACKAGES/p' .config | sed -e 's/CONFIG_TARGET_ARCH_PACKAGES\="//' -e 's/"//') || true
            # 清理 .config 以便下一个 config 使用干净环境
            git checkout -- .config || true
          fi

          export parameter=$parameter\{\'config\':\'$cfg\',\'target\':\'$tgt\',\'subtarget\':\'$sub\',\'targetarchpackages\':\'$archpkgs\'\},
          echo "::notice ::配置$cfg 的Release名:OpenWrt-$starttime-$tgt-$sub_$OPENWRT_TAG_BRANCH"
          echo "::notice ::配置$cfg 编译的架构为$tgt,子架构为$sub,软件包目标架构为:$archpkgs"
          echo "$starttime_$tgt-$sub_$OPENWRT_TAG_BRANCH" >> $TMPFILE

        done < $TMPFILE

        # 清理临时 openwrt
        if [ -n "$OPENWRT_TMP_DIR" ]; then
          rm -rf "$OPENWRT_TMP_DIR"
        fi

        export parameter=$parameter]
        export parameter=$(echo $parameter|sed "s/},]/}]/g")
        # 检查是否会生成重名 Release
        if sort $TMPFILE | uniq -d | grep -q . ; then
          echo "::error ::配置会生成重名的Release"
          exit 1
        fi
        echo parameter=$parameter >> "$GITHUB_ENV"
      shell: bash

    - id: config-generator
      run: |
        echo "$parameter" >> $GITHUB_OUTPUT
        echo "$parameter"
      shell: bash
