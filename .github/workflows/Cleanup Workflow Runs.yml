name: Cleanup Workflow Runs

on:
  workflow_dispatch:
    inputs:
      SSH_ACTION:
        description: '开启 SSH 远程调试 (tmate)'
        required: false
        default: false
        type: boolean
#  schedule:
#    - cron: '0 0 * * *'  # 每天 00:00 运行

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: SSH 远程调试
        if: inputs.SSH_ACTION == true || inputs.SSH_ACTION == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        with:
          limit-access-to-actor: false

      - name: 清理历史工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
